<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Brivane Notes</title>
<style>
:root{
  --bg:#FFFFFF;--bg-rgb:255,255,255;--surface:#F5F5F5;--surface2:#ECECEE;--floating:#FFFFFF;--popup:#FFFFFF;
  --text:#1C1C1E;--text2:#6E6E73;--accent:#2596be;--accent-rgb:37,150,190;--on-accent:#FFFFFF;--accent-container:rgba(37,150,190,.16);
  --border:#ECECEE;--outline:#DCDCE0;--danger:#FF3B30;
  --tb-shadow:0 6px 24px rgba(0,0,0,.14);--popup-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  --snack-bg:#323232;--snack-fg:#F2F2F2;--snack-act:#7CCBEA;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --top-extra:46px;--bar-h:58px;--kb:0px;
  --emphasized:cubic-bezier(.2,0,0,1);--emphasized-decel:cubic-bezier(.05,.7,.1,1);--emphasized-accel:cubic-bezier(.3,0,.8,.15);--ios:cubic-bezier(.32,.72,0,1);
  --sheet-r:34px;
  --code-bg:#F2F2F3;--code-header:#E8E8EA;--code-text:#1F2328;
  --n-none:var(--surface);--n-red:#FDE3E1;--n-orange:#FDEBD7;--n-yellow:#FBF4CB;--n-green:#E1F3DC;--n-teal:#D7F0EE;--n-blue:#DCEBFA;--n-purple:#E9E0F8;--n-pink:#FADDEB;--n-ink:#1C1C1E;
}
[data-theme="dark"]{
  --bg:#0D0D0D;--bg-rgb:13,13,13;--surface:#1F1F1F;--surface2:#2A2A2C;--floating:#1F1F1F;--popup:#1F1F1F;
  --text:#F2F2F2;--text2:#9B9B9F;--on-accent:#FFFFFF;--border:#3A3A3C;--outline:#48484A;--danger:#FF453A;
  --tb-shadow:0 6px 24px rgba(0,0,0,.55);--popup-shadow:0 8px 28px rgba(0,0,0,.5);
  --snack-bg:#E3E3E6;--snack-fg:#1C1C1E;--snack-act:#0E6C8C;
  --code-bg:#161616;--code-header:#1F1F1F;--code-text:#E8E8E8;
  --n-red:#4A2624;--n-orange:#4A3320;--n-yellow:#46411D;--n-green:#24391F;--n-teal:#1E3B39;--n-blue:#1F3448;--n-purple:#35294F;--n-pink:#4C263A;--n-ink:#F2F2F2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
input:focus,textarea:focus,button:focus,[contenteditable]:focus{outline:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;font-family:inherit}
.tap{transition:transform .2s var(--emphasized),opacity .2s ease}
.tap:active{transform:scale(.95);opacity:.85}

.icon{
  pointer-events:none;
  display:inline-block;
  vertical-align:middle;
  flex-shrink:0;
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-position:center;
  mask-position:center;
  -webkit-mask-size:contain;
  mask-size:contain;
  width:24px;
  height:24px
}
.icon.sm{width:16px;height:16px}.icon.md{width:20px;height:20px}.icon.lg{width:28px;height:28px}.icon.xl{width:34px;height:34px}
.icon.xxl{width:44px;height:44px}.icon.hg{width:52px;height:52px}
.icon-png{pointer-events:none;display:inline-block;vertical-align:middle;flex-shrink:0;object-fit:contain}

#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#root{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .42s var(--ios);will-change:transform}
#root.pushed{transform:translate3d(-28%,0,0)}
#root-dim{position:absolute;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity .42s var(--ios)}

#topbar{position:relative;z-index:20;flex-shrink:0;padding:calc(var(--safe-top) + var(--top-extra)) 20px 12px;display:flex;align-items:center;gap:10px;background:var(--bg)}
#page-title{flex:1;min-width:0;font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-btn{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--surface);color:var(--text);border:0;display:flex;align-items:center;justify-content:center}
.top-btn .icon{width:20px;height:20px}

#tabs{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain;padding-top:4px;padding-bottom:120px;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s}
.view::-webkit-scrollbar{display:none}
.view.active{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .28s ease,visibility 0s}
.section{margin-bottom:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:12px}
.section-title.small{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text2)}

#bottom-bar{position:relative;flex-shrink:0;z-index:30;display:flex;align-items:stretch;height:calc(var(--bar-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--bg);transition:background .3s ease}
.bb-item{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text2);transition:color .2s ease,transform .2s var(--emphasized)}
.bb-item:active{transform:scale(.94)}
.bb-item .icon{width:24px;height:24px}
.bb-item span{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bb-item.active{color:var(--accent)}

.fchip{padding:9px 18px;border-radius:999px;border:0;flex-shrink:0;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;transition:background .25s ease,color .25s ease;display:flex;align-items:center;gap:6px}
.fchip .icon{width:16px;height:16px}
.fchip.active{background:var(--accent);color:var(--on-accent)}
#home-filters{display:flex;gap:8px;padding:2px 20px 16px;overflow-x:auto;scrollbar-width:none}
#home-filters::-webkit-scrollbar{display:none}

.notes-grid{display:flex;gap:12px;padding:0 20px;align-items:flex-start}
.notes-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.notes-list{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.note-card{position:relative;border-radius:22px;padding:15px 15px 13px;background:var(--n-none);color:var(--n-ink);animation:fadeUp .4s var(--emphasized-decel) both;overflow:hidden;text-align:left;border:1.5px solid transparent;transition:transform .2s var(--emphasized),border-color .2s ease,background .2s ease}
.note-card:active{transform:scale(.97)}
.note-card.sel{border-color:var(--accent)}
.note-card[data-c="red"]{background:var(--n-red)}.note-card[data-c="orange"]{background:var(--n-orange)}.note-card[data-c="yellow"]{background:var(--n-yellow)}.note-card[data-c="green"]{background:var(--n-green)}
.note-card[data-c="teal"]{background:var(--n-teal)}.note-card[data-c="blue"]{background:var(--n-blue)}.note-card[data-c="purple"]{background:var(--n-purple)}.note-card[data-c="pink"]{background:var(--n-pink)}
.nc-pin{position:absolute;top:12px;right:12px;opacity:.55}
.nc-pin .icon{width:15px;height:15px}
.nc-title{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.25;padding-right:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.nc-body{font-size:14px;line-height:1.4;opacity:.78;margin-top:6px;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
.nc-body:first-child{margin-top:0;opacity:.9;font-size:15px}
.nc-img{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:16px;margin-top:8px;background:rgba(127,127,127,.15)}
.nc-img:first-child{margin-top:0}
.nc-check{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.35;margin-top:5px;opacity:.85}
.nc-check .icon{width:17px;height:17px;margin-top:1px;opacity:.7}
.nc-check.done{text-decoration:line-through;opacity:.45}
.nc-check span{min-width:0;word-break:break-word}
.nc-more{font-size:12px;font-weight:700;opacity:.55;margin-top:6px}
.nc-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.nc-tag,.nc-fold{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(127,127,127,.18);display:inline-flex;align-items:center;gap:4px}
.nc-tag .icon,.nc-fold .icon{width:12px;height:12px}
.nc-rem,.nc-lock{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-container);color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.nc-rem .icon,.nc-lock .icon{width:12px;height:12px}
.nc-rem.late{background:rgba(255,59,48,.15);color:var(--danger)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

#sel-bar{position:absolute;left:0;right:0;top:0;z-index:25;display:none;align-items:center;gap:2px;padding:calc(var(--safe-top) + var(--top-extra) - 6px) 10px 10px 8px;background:var(--bg)}
#sel-bar.show{display:flex}
#sel-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;padding-left:4px}
#sel-num{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1}
#sel-lbl{font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-plain{width:44px;height:44px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.icon-plain .icon{width:24px;height:24px}
.icon-plain:active{background:var(--surface)}
.icon-plain.danger{color:var(--danger)}
.icon-plain.disabled{opacity:.32;pointer-events:none}
#sel-bar .icon-plain{width:40px;height:40px}
#sel-bar .icon-plain .icon{width:22px;height:22px}

#search-row{display:flex;align-items:center;padding:0 20px;margin-bottom:6px}
#search-fake{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:999px;background:var(--surface);color:var(--text2);font-size:16px;font-weight:500;border:0;text-align:left}
#search-fake .icon{width:21px;height:21px}
#tags-strip{padding:14px 0 4px}
#tags-strip .ra-title{font-size:18px;font-weight:800;letter-spacing:-.3px;padding:0 20px 12px}
.tag-row{display:flex;gap:8px;padding:0 20px 6px;flex-wrap:wrap}
#cat-title{font-size:22px;font-weight:800;letter-spacing:-.5px;padding:18px 20px 14px}
#cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.cat-card{position:relative;height:96px;border-radius:22px;overflow:hidden;border:0;text-align:left;color:#fff;padding:14px 16px;font-size:17px;font-weight:800;letter-spacing:-.2px;animation:fadeUp .4s var(--emphasized-decel) both}
.cat-card .icon{position:absolute;right:-6px;bottom:-8px;width:64px;height:64px;opacity:.3;transform:rotate(-18deg)}
.cat-card small{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:3px;letter-spacing:0}

#sp-bar{padding-right:14px}
#sp-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 18px;border-radius:999px;background:var(--surface)}
#sp-wrap>.icon{width:21px;height:21px;color:var(--text2);flex-shrink:0}
#sp-input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--text);font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none}
#sp-input::placeholder{color:var(--text2);font-weight:500;opacity:.9}
#sp-input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#sp-clear{width:38px;height:38px;border-radius:50%;border:0;flex-shrink:0;background:var(--surface2);color:var(--text2);display:none;align-items:center;justify-content:center}
#sp-clear.show{display:flex}
#sp-clear .icon{width:18px;height:18px}

.row-list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:10px 8px 10px 20px;animation:fadeUp .35s var(--emphasized-decel) both;transition:background .15s ease;width:100%;border:0;background:transparent;color:var(--text);text-align:left}
.row:active{background:var(--surface)}
.row-ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-container);color:var(--accent)}
.row-ic .icon{width:26px;height:26px}
.row-info{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:14px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn-fill{height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.btn-fill .icon{width:20px;height:20px}
.btn-outline{height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--outline);background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.btn-outline .icon{width:18px;height:18px}

#fab{position:absolute;right:20px;z-index:52;width:58px;height:58px;border-radius:50%;border:0;bottom:calc(var(--bar-h) + var(--safe-bottom) + 18px);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.2);transform:scale(1);opacity:1;transition:transform .38s var(--emphasized),opacity .3s var(--emphasized),bottom .3s var(--emphasized)}
#fab .icon{width:28px;height:28px}
#fab:active{transform:scale(.92)}
#fab.fab-hidden{transform:scale(0);opacity:0;pointer-events:none}
body.snack-on:not(.on-page):not(.sel-mode) #fab{bottom:calc(var(--bar-h) + var(--safe-bottom) + 18px + 58px)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;color:var(--text2)}
.empty-state>.icon{width:52px;height:52px;opacity:.35;margin-bottom:14px}
.empty-state .es-t{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state .es-s{font-size:14px;line-height:1.4;max-width:260px}
.empty-state .btn-fill{margin-top:18px}

.page{position:absolute;inset:0;z-index:60;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ios),visibility 0s linear .42s;box-shadow:-10px 0 28px rgba(0,0,0,.14);will-change:transform;contain:layout paint}
.page.open{transform:translate3d(0,0,0);visibility:visible;transition:transform .42s var(--ios),visibility 0s}
.page.behind{transform:translate3d(-28%,0,0);visibility:visible}
.page.leaving{transform:translate3d(100%,0,0);visibility:visible;transition:transform .36s var(--ios),visibility 0s linear .36s}
.page.dragging,#root.dragging{transition:none!important}
.page-bar{flex-shrink:0;padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;display:flex;align-items:center;gap:2px;background:var(--bg)}
.page-back{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-back .icon{width:26px;height:26px}
.page-back:active{background:var(--surface)}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:100px;overscroll-behavior-y:contain}
.page-body::-webkit-scrollbar{display:none}
#swipe-edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:65;display:none;touch-action:none}
#swipe-edge.on{display:block}

#page-editor{transition:transform .42s var(--ios),visibility 0s linear .42s,background .3s ease}
#page-editor.open{transition:transform .42s var(--ios),visibility 0s,background .3s ease}
#ed-bar-actions{display:flex;align-items:center;gap:2px}
#ed-bar-actions .icon-plain{width:40px;height:40px}
#ed-bar-actions .icon-plain .icon{width:22px;height:22px}
#ed-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 20px calc(var(--kb) + 140px);overscroll-behavior-y:contain;scroll-padding-bottom:120px;transition:padding-bottom .18s var(--emphasized)}
#ed-scroll::-webkit-scrollbar{display:none}
#ed-title{width:100%;border:0;background:transparent;color:var(--text);resize:none;overflow:hidden;font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.2;padding:6px 0;display:block}
#ed-title::placeholder{color:var(--text2);opacity:.55}
#ed-meta{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 12px;align-items:center}
.meta-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:0;background:var(--surface);color:var(--text);font-size:13px;font-weight:700}
.meta-chip .icon{width:16px;height:16px}
.meta-chip.accent{background:var(--accent-container);color:var(--accent)}
.meta-chip.late{background:rgba(255,59,48,.15);color:var(--danger)}
#ed-body-canvas{position:relative;min-height:36vh}
#ed-body{color:var(--text);font-size:17px;line-height:1.6;font-weight:500;padding:4px 0;word-break:break-word;min-height:36vh}
#ed-body:empty::before{content:attr(data-ph);color:var(--text2);opacity:.55;pointer-events:none}
#ed-body img{max-width:100%;height:auto;border-radius:18px;display:block;margin:10px 0}
#ed-body hr{border:0;height:2px;background:var(--outline);margin:16px 0;border-radius:2px}
#ed-body blockquote{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:10px 0;opacity:.9;border-radius:0 8px 8px 0;transition:background .15s ease}
#ed-body ul,#ed-body ol{padding-left:26px;margin:6px 0}
#ed-body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
#ed-body code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border-radius:8px;padding:1px 6px;font-size:.92em}
#ed-bg-preview{display:none;border-radius:16px;overflow:hidden;margin-bottom:12px}
#ed-bg-preview.show{display:block}
#ed-bg-preview img{width:100%;max-height:160px;object-fit:cover;display:block}

.bri-table-wrap{position:relative;margin:14px 0;border-radius:16px;overflow:hidden;border:1.5px solid var(--outline);background:var(--surface)}
.bri-table-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.bri-table-scroll table{border-collapse:collapse;width:max-content;min-width:100%}
.bri-table-scroll td,.bri-table-scroll th{border:1px solid var(--outline);padding:11px 14px;min-width:110px;position:relative;vertical-align:top;font-size:14.5px;word-break:break-word;white-space:pre-wrap;background:var(--bg);color:var(--text)}
.bri-table-scroll th{background:var(--surface2);font-weight:800;font-size:13.5px}
.bri-table-scroll td:first-child,.bri-table-scroll th:first-child{position:sticky;left:0;z-index:1;background:var(--surface2);font-weight:700}
.bri-table-ctrl{display:flex;gap:6px;padding:7px 10px;justify-content:flex-end;background:var(--surface);border-top:1px solid var(--outline)}
.bri-table-ctrl button{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface2);color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bri-table-ctrl button .icon{width:16px;height:16px}
.col-resize-handle{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;touch-action:none;z-index:2}
#ed-body blockquote .bri-table-wrap{margin:8px 0 4px}

#ed-body .bri-video{position:relative;border-radius:18px;overflow:hidden;background:#000;margin:10px 0;max-width:100%}
#ed-body .bri-video img{display:block;width:100%;border-radius:0;margin:0}
#ed-body .bri-video .vp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);pointer-events:none}
#ed-body .bri-video .vp .icon{width:52px;height:52px;color:#fff}

.img-resizable{position:relative;display:inline-block;max-width:100%;margin:10px 0;border-radius:18px;overflow:hidden}
.img-resizable img{display:block;width:100%;height:100%;object-fit:cover;border-radius:0;margin:0}

#link-popup{position:absolute;z-index:95;background:var(--popup);border-radius:18px;box-shadow:var(--popup-shadow);padding:6px;display:none;min-width:220px;max-width:300px}
#link-popup.open{display:block;animation:fadeUp .18s var(--emphasized-decel) both}
#link-popup .lp-url{font-size:12px;color:var(--text2);padding:8px 12px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#link-popup .lp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:transparent;border:0;width:100%;text-align:left;color:var(--text);font-size:14px;font-weight:600}
#link-popup .lp-row:active{background:var(--surface)}
#link-popup .lp-row .icon{width:18px;height:18px;color:var(--text2)}

#webview-modal{position:absolute;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column}
#webview-modal.open{display:flex}
#wv-top{padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;display:flex;align-items:center;gap:8px}
#wv-frame{flex:1;border:0;width:100%;background:#fff}
#wv-url-bar{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;padding:0 4px}

#paste-modal{position:absolute;inset:0;z-index:155;background:var(--bg);display:none;flex-direction:column}
#paste-modal.open{display:flex}
#paste-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(var(--safe-bottom) + 40px)}
#paste-body pre{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.6;color:var(--text);font-family:inherit}

#pin-screen{position:absolute;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
#pin-screen.open{display:flex}
#pin-title{font-size:19px;font-weight:800;text-align:center}
#pin-sub{font-size:13.5px;color:var(--text2);text-align:center;margin-top:-12px;max-width:280px}
#pin-dots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:300px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--outline)}
.pin-dot.fill{background:var(--accent);border-color:var(--accent)}
#pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:4px}
.pin-key{width:74px;height:74px;border-radius:50%;background:var(--surface);color:var(--text);border:0;font-size:25px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pin-key:active{background:var(--surface2)}
.pin-key .icon{width:26px;height:26px}
#pin-length-row{display:flex;gap:8px;margin-top:-6px}
.pin-len-chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--outline);background:transparent;color:var(--text2);font-size:12.5px;font-weight:700}
.pin-len-chip.sel{border-color:var(--accent);background:var(--accent-container);color:var(--accent)}

.color-picker-sv{position:relative;width:100%;height:180px;border-radius:16px;overflow:hidden;touch-action:none}
.color-picker-sv .sv-thumb{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.color-picker-hue{position:relative;width:100%;height:24px;border-radius:12px;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.color-picker-hue .hue-thumb{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.2);box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.color-hex-input{border:1.5px solid var(--outline);border-radius:12px;padding:10px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:var(--text);background:transparent;width:100%}

/* Gráficos — cards retos, tocam a borda, tom do fundo */
.chart-wrap{margin:14px -20px;padding:16px 20px 14px;background:var(--bg);border-top:1px solid var(--outline);border-bottom:1px solid var(--outline);animation:chartIn .5s var(--emphasized-decel) both}
@keyframes chartIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chart-title{font-size:14.5px;font-weight:800;margin-bottom:10px}
.chart-legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 0 0}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--text2)}
.chart-legend-dot{width:9px;height:9px;flex-shrink:0}
.chart-svg-holder{width:100%}
.chart-svg-holder svg{display:block;width:100%}
.chart-bar-val{font-size:10.5px;font-weight:800;fill:#fff}
.chart-color-row{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 8px;scrollbar-width:none}
.chart-color-row::-webkit-scrollbar{display:none}
.chart-series-row{display:flex;align-items:center;gap:10px;padding:9px 20px}
.chart-series-row input[type=text]{flex:1;height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--outline);background:var(--surface);color:var(--text);font-size:14px}
.chart-series-row input[type=number]{width:78px;height:46px;padding:0 10px;border-radius:12px;border:1.5px solid var(--outline);background:var(--surface);color:var(--text);font-size:14px;text-align:center}
.chart-swatch{width:34px;height:34px;border-radius:10px;flex-shrink:0;border:2px solid var(--outline)}
.chart-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 20px 10px}
.chart-type-card{aspect-ratio:1;border-radius:18px;border:1.5px solid var(--outline);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--text2);padding:8px}
.chart-type-card.sel{border-color:var(--accent);background:var(--accent-container);color:var(--accent)}
.chart-type-card img{width:34px;height:34px;object-fit:contain}

body.modal-lock #ed-title,body.modal-lock #ed-body,body.modal-lock [contenteditable="true"],body.modal-lock input,body.modal-lock textarea{caret-color:transparent}

#toast{position:absolute;left:8px;right:8px;max-width:560px;margin:0 auto;z-index:140;bottom:calc(var(--bar-h) + var(--safe-bottom) + 8px);min-height:48px;padding:6px 8px 6px 16px;border-radius:4px;background:var(--snack-bg);color:var(--snack-fg);box-shadow:0 2px 6px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .25s var(--emphasized-decel),opacity .2s linear}
body.on-page #toast{bottom:calc(var(--safe-bottom) + 12px)}
body.editor-open #toast{bottom:calc(var(--kb) + var(--safe-bottom) + 16px + 52px + 10px)}
#toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
#toast-msg{flex:1;min-width:0;padding:8px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toast-act{border:0;background:transparent;color:var(--snack-act);font-size:14px;font-weight:600;padding:0 12px;height:36px;border-radius:4px;flex-shrink:0;display:none}
</style>
</head>

<script>
const isApp = typeof Android !== 'undefined' && Android.isInsideApp && Android.isInsideApp();
const has = fn => isApp && typeof Android[fn] === 'function';
const $ = id => document.getElementById(id);
const raf = fn => requestAnimationFrame(fn);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const DEFAULT_ACCENT = [37, 150, 190];

const ICON_BASE = 'icons/svg/';
const ICON_PNG_BASE = 'icons/png/';
function ic(name, size) {
  const s = size || 24;

function openColorCreatorSheet(initialHex, onConfirm) {

    <div style="padding:0 20px 12px;display:flex;align-items:center;gap:12px"><div id="cc-preview" style="width:44px;height:44px;border-radius:50%;border:2px solid var(--outline);flex-shrink:0"></div><input type="text" class="color-hex-input" id="cc-hex" value="${esc(initialHex.toUpperCase())}" maxlength="7"/></div>
    <div style="padding:4px 20px"><button class="btn-fill tap" id="cc-confirm" style="width:100%;justify-content:center">${esc(t('apply'))}</button></div>`, { keepFocus: true });

  hueEl.addEventListener('touchstart', e => { e.stopPropagation(); hueDragging = true; huePointer(e.touches[0].clientX); }, { capture: true, passive: true });
  hueEl.addEventListener('touchmove', e => { if (!hueDragging) return; e.stopPropagation(); if (e.cancelable) e.preventDefault(); huePointer(e.touches[0].clientX); }, { capture: true, passive: false });

/* ── PIN / Bloqueio real de nota — tela em vez de modal; nº de dígitos configurável ── */
let pinOpen = false, pinNoteId = null, pinBuffer = '', pinStage = 'enter', pinFirstEntry = '', pinOnSuccess = null, pinLen = 4;

function renderPinDots() {
  $('pin-dots').innerHTML = Array.from({ length: pinLen }).map((_, i) => `<span class="pin-dot${i < pinBuffer.length ? ' fill' : ''}"></span>`).join('');
}

  $('pin-pad').innerHTML = keys.map(k => k === '' ? '<div></div>' : `<button class="pin-key tap" data-k="${k}">${k === 'del' ? ic('backspace-outline', 28) : k}</button>`).join('');
  $('pin-pad').querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => onPinKey(b.dataset.k)));

  if (pinStage === 'set-confirm') {
    if (pinBuffer !== pinFirstEntry) { toast(t('pinMismatch')); pinBuffer = ''; pinStage = 'set-first'; $('pin-title').textContent = t('setPinTitle'); renderPinDots(); return; }
    if (has('setNotePin')) { try { Android.setNotePin(pinNoteId, pinBuffer); } catch (_) { webSetNotePin(pinNoteId, pinBuffer); } } else webSetNotePin(pinNoteId, pinBuffer);
    const n = getNote(pinNoteId); if (n) { n.lock = { type: 'pin' }; persist(); refreshAll(); } else if (editing && editing.id === pinNoteId) { editing.lock = { type: 'pin' }; syncEditorMode(); renderEditorMeta(); scheduleSave(); }

    else ok = webVerifyNotePin(pinNoteId, pinBuffer);

/* CORRIGIDO: o bloqueio agora efetivamente impede a abertura — requireUnlock nunca deixa

    json: [[/"(?:\\.|[^"\\])*"/g,'tok-string'],[/\b\d+(?:\.\d+)?\b/g,'tok-number'],[/\b(true|false|null)\b/g,'tok-const']],
    bash: [[/#[^\n]*/g,'tok-comment'],[/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/g,'tok-string'],[/\b(if|then|else|fi|for|while|do|done|echo|export)\b/g,'tok-keyword']],

function buildChartSVG(d, width, height) {
  const total = d.series.reduce((a, s) => a + Math.max(0, s.value), 0) || 1;
  const max = Math.max(...d.series.map(s => s.value), 1);
  if (d.type === 'pie' || d.type === 'donut') {
    const cx = width / 2, cy = height / 2, r = Math.min(width, height) / 2 - 6, ir = d.type === 'donut' ? r * 0.55 : 0;
    let angle = -Math.PI / 2, paths = '', labels = '';
    d.series.forEach((s, idx) => {
      const frac = Math.max(0, s.value) / total, a2 = angle + frac * Math.PI * 2, mid = (angle + a2) / 2;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle), x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const large = (a2 - angle) > Math.PI ? 1 : 0;
      const lr = ir > 0 ? (r + ir) / 2 : r * 0.62;
      const lx = cx + lr * Math.cos(mid), ly = cy + lr * Math.sin(mid);
      if (ir > 0) {
        const ix1 = cx + ir * Math.cos(angle), iy1 = cy + ir * Math.sin(angle), ix2 = cx + ir * Math.cos(a2), iy2 = cy + ir * Math.sin(a2);
        paths += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${ir} ${ir} 0 ${large} 0 ${ix1} ${iy1} Z" fill="${s.color}" style="animation:chartSliceIn .5s cubic-bezier(.05,.7,.1,1) ${idx*70}ms both;transform-origin:${cx}px ${cy}px"/>`;
      } else {
        paths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${s.color}" style="animation:chartSliceIn .5s cubic-bezier(.05,.7,.1,1) ${idx*70}ms both;transform-origin:${cx}px ${cy}px"/>`;
      }
      if (frac > 0.06) labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" class="chart-bar-val" style="animation:chartFadeIn .4s ease ${idx*70+250}ms both">${Math.round(frac*100)}%</text>`;
      angle = a2;
    });
    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}"><style>@keyframes chartSliceIn{from{transform:scale(0)}to{transform:scale(1)}}@keyframes chartFadeIn{from{opacity:0}to{opacity:1}}</style>${paths}${labels}</svg>`;
  }
  if (d.type === 'bar') {
    const padL = 4, padB = 4, gap = 12, n = d.series.length, barW = Math.max(20, (width - padL * 2 - gap * (n - 1)) / n), baseY = height - padB;
    let bars = '';
    d.series.forEach((s, i) => {
      const bh = Math.max(3, (s.value / max) * (height - padB - 26)), x = padL + i * (barW + gap), y = baseY - bh;
      bars += `<rect x="${x}" y="${baseY}" width="${barW}" height="0" fill="${s.color}"><animate attributeName="y" from="${baseY}" to="${y}" dur=".55s" begin="${i*70}ms" fill="freeze" calcMode="spline" keySplines=".05 .7 .1 1"/><animate attributeName="height" from="0" to="${bh}" dur=".55s" begin="${i*70}ms" fill="freeze" calcMode="spline" keySplines=".05 .7 .1 1"/></rect>`;
      const valY = y + 16;
      bars += `<text x="${x + barW/2}" y="${Math.min(valY, baseY - 6)}" text-anchor="middle" class="chart-bar-val" style="opacity:0"><animate attributeName="opacity" from="0" to="1" dur=".3s" begin="${i*70+350}ms" fill="freeze"/>${s.value}</text>`;
    });
    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${bars}<line x1="0" y1="${baseY}" x2="${width}" y2="${baseY}" stroke="currentColor" stroke-opacity=".15"/></svg>`;
  }
  if (d.type === 'line' || d.type === 'area') {
    const padL = 4, padR = 4, padT = 16, padB = 10, n = d.series.length, stepX = n > 1 ? (width - padL - padR) / (n - 1) : 0;
    const pts = d.series.map((s, i) => { const x = padL + i * stepX, y = height - padB - (s.value / max) * (height - padT - padB); return [x, y]; });
    const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ' ' + p[1]).join(' ');
    const color = d.series[0] ? d.series[0].color : CHART_PALETTE[0];
    const pathLen = width * 1.4;
    let area = '';
    if (d.type === 'area') { area = `<path d="${line} L ${pts[pts.length-1][0]} ${height-padB} L ${pts[0][0]} ${height-padB} Z" fill="${color}" fill-opacity="0"><animate attributeName="fill-opacity" from="0" to=".22" dur=".6s" begin=".2s" fill="freeze"/></path>`; }
    const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="0" fill="${color}"><animate attributeName="r" from="0" to="4" dur=".3s" begin="${.5+i*.05}s" fill="freeze"/></circle><text x="${p[0]}" y="${Math.max(12,p[1]-10)}" text-anchor="middle" class="chart-bar-val" style="fill:var(--text);opacity:0"><animate attributeName="opacity" from="0" to="1" dur=".3s" begin="${.7+i*.05}s" fill="freeze"/>${d.series[i].value}</text>`).join('');
    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${area}<path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${pathLen}" stroke-dashoffset="${pathLen}"><animate attributeName="stroke-dashoffset" from="${pathLen}" to="0" dur=".7s" begin="0s" fill="freeze" calcMode="spline" keySplines=".05 .7 .1 1"/></path>${dots}</svg>`;
  }
  return '';
}

  const box = $('folder-list');
  if (!FOLDERS.length) { box.innerHTML = `<div class="empty-state">${ic('folder-open-outline', 52)}<div class="es-t">${esc(t('noFolders'))}</div><div class="es-s">${esc(t('noFoldersSub'))}</div><button class="btn-fill tap" id="empty-folder">${ic('add', 20)}${esc(t('newFolder'))}</button></div>`; $('empty-folder').addEventListener('click', createFolderFlow); return; }
  box.innerHTML = `<div class="row-list">${FOLDERS.map((f, i) => { const c = activeNotes().filter(n => n.folder === f.id).length; return `<button class="row tap" data-id="${f.id}" style="animation-delay:${Math.min(i, 8) * 30}ms"><div class="row-ic">${ic('folder', 26)}</div><div class="row-info"><div class="row-title">${esc(f.name)}</div><div class="row-sub">${c} ${c === 1 ? t('note') : t('notesN')}</div></div>${ic('chevron-forward', 18)}</button>`; }).join('')}</div>`;
  box.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => { openFolderId = r.dataset.id; pushPage('page-folder'); }));
}
function createFolderFlow() { openDialog(t('newFolder'), '', t('create'), name => { FOLDERS.push({ id: uid('f'), name }); persist(); renderFolders(); toast(t('folderCreated')); }); }
function renderFolderPage() {
  const f = FOLDERS.find(x => x.id === openFolderId); if (!f) return;
  $('folder-title').textContent = f.name;
  const list = sortNotes(activeNotes().filter(n => n.folder === f.id)), body = $('folder-body');
  if (!list.length) { body.innerHTML = `<div class="empty-state">${ic('folder-open-outline', 52)}<div class="es-t">${esc(t('emptyFolder'))}</div><div class="es-s">${esc(t('emptyFolderSub'))}</div><button class="btn-fill tap" id="folder-new-note">${ic('add', 20)}${esc(t('newNote'))}</button></div>`; $('folder-new-note').addEventListener('click', () => openEditor(null, { folder: f.id })); return; }
  renderNotesInto(body, list, { noSelect: true });
}
pageHooks['page-folder'] = { open: renderFolderPage, close() { renderFolders(); } };
$('folder-more').addEventListener('click', () => {
  const f = FOLDERS.find(x => x.id === openFolderId); if (!f) return;
  const entry = openSheet(`<div class="sheet-head"><div class="sh-ic">${ic('folder', 26)}</div><div style="min-width:0;flex:1"><div class="sh-t">${esc(f.name)}</div></div></div>${sheetItem('new', 'add', t('newNote'))}${sheetItem('rename', 'create-outline', t('renameFolder'))}${sheetItem('delete', 'trash-outline', t('deleteFolder'), true)}`);
  entry.content.querySelector('[data-act="new"]').addEventListener('click', () => { closeSheet(entry); openEditor(null, { folder: f.id }); });
  entry.content.querySelector('[data-act="rename"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('renameFolder'), f.name, t('save'), name => { f.name = name; persist(); renderFolderPage(); }), 200)));
  entry.content.querySelector('[data-act="delete"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('deleteFolder'), '', t('delete'), () => { NOTES.forEach(n => { if (n.folder === f.id) n.folder = ''; }); FOLDERS = FOLDERS.filter(x => x.id !== f.id); persist(); popPage(); renderFolders(); toast(t('folderDeleted')); }, { noInput: true, message: f.name + '?', danger: true }), 200)));
});

function renderArchive() {
  const list = sortNotes(NOTES.filter(n => n.archived && !n.trashed)), body = $('archive-body');
  if (!list.length) { body.innerHTML = `<div class="empty-state">${ic('archive-outline', 52)}<div class="es-t">${esc(t('emptyArchive'))}</div><div class="es-s">${esc(t('emptyArchiveSub'))}</div></div>`; return; }
  renderNotesInto(body, list, { noSelect: true, showFolder: true });
}
pageHooks['page-archive'] = { open() { $('archive-title').textContent = t('archiveT'); renderArchive(); }, close() { refreshAll(); } };
function renderTrash() {
  purgeTrash(); const list = NOTES.filter(n => n.trashed).sort((a, b) => b.trashedAt - a.trashedAt), body = $('trash-body');
  $('trash-empty').style.visibility = list.length ? 'visible' : 'hidden';
  if (!list.length) { body.innerHTML = `<div class="empty-state">${ic('trash-outline', 52)}<div class="es-t">${esc(t('emptyTrash'))}</div><div class="es-s">${esc(t('emptyTrashSub'))}</div></div>`; return; }
  body.innerHTML = `<div class="row-list">${list.map((n, i) => { const left = Math.max(0, Math.ceil((n.trashedAt + settings.trashDays * 86400000 - Date.now()) / 86400000)); return `<button class="row tap" data-id="${n.id}" style="animation-delay:${Math.min(i, 8) * 30}ms"><div class="row-ic" style="background:var(--surface2);color:var(--text2)">${ic('document-text', 26)}</div><div class="row-info"><div class="row-title">${esc(noteLabel(n))}</div><div class="row-sub">${left} ${esc(t('days'))}</div></div></button>`; }).join('')}</div>`;
  body.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
    const n = getNote(r.dataset.id); if (!n) return;
    const entry = openSheet(`<div class="sheet-head"><div class="sh-ic">${ic('document-text', 26)}</div><div style="min-width:0;flex:1"><div class="sh-t">${esc(noteLabel(n))}</div></div></div>${sheetItem('restore', 'arrow-undo-outline', t('restore'))}${sheetItem('del', 'trash-bin-outline', t('deleteForever'), true)}`);
    entry.content.querySelector('[data-act="restore"]').addEventListener('click', () => { closeSheet(entry); n.trashed = false; n.trashedAt = 0; persist(); renderTrash(); toast(t('restored')); });
    entry.content.querySelector('[data-act="del"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('deleteForever'), '', t('delete'), () => { NOTES = NOTES.filter(x => x.id !== n.id); persist(); renderTrash(); }, { noInput: true, message: t('deleteForeverQ'), danger: true }), 200)));
  }));
}
pageHooks['page-trash'] = { open() { $('trash-title').textContent = t('trashT'); renderTrash(); }, close() { refreshAll(); } };
$('trash-empty').addEventListener('click', () => openDialog(t('emptyTrashBtn'), '', t('delete'), () => { NOTES = NOTES.filter(n => !n.trashed); persist(); renderTrash(); toast(t('trashEmptied')); }, { noInput: true, message: t('emptyTrashQ'), danger: true }));

const themeOpts = () => [{id:'system',name:t('themeAuto')},{id:'light',name:t('themeLight')},{id:'dark',name:t('themeDark')}];
const viewOpts = () => [{id:'grid',name:t('gridView')},{id:'list',name:t('listView')}];
const sortOpts = () => [{id:'edited',name:t('sortEdited')},{id:'created',name:t('sortCreated')},{id:'title',name:t('sortTitle')},{id:'color',name:t('sortColor')}];
const trashOpts = () => [7, 14, 30, 60].map(d => ({ id: d, name: d + ' ' + t('days') }));
const pinLenOpts = () => [4,5,6].map(n => ({ id: n, name: String(n) }));
const nameOf = (opts, id) => (opts.find(o => String(o.id) === String(id)) || opts[0]).name;
const rowLinkPng = (id, pngName, title, sub, val) => `<button class="set-row tap" data-set="${id}">${icPng(pngName, 24)}<div class="set-txt"><div class="set-t">${title}</div>${sub ? `<div class="set-s">${sub}</div>` : ''}</div>${val ? `<div class="set-val">${esc(val)}</div>` : ''}${ic('chevron-forward', 18)}</button>`;
const rowLink = (id, icon, title, sub, val) => `<button class="set-row tap" data-set="${id}">${ic(icon, 24)}<div class="set-txt"><div class="set-t">${title}</div>${sub ? `<div class="set-s">${sub}</div>` : ''}</div>${val ? `<div class="set-val">${esc(val)}</div>` : ''}${ic('chevron-forward', 18)}</button>`;
const rowSwitch = (id, icon, title, sub, on) => `<button class="set-row" data-sw="${id}">${ic(icon, 24)}<div class="set-txt"><div class="set-t">${title}</div>${sub ? `<div class="set-s">${sub}</div>` : ''}</div><div class="switch${on ? ' on' : ''}"></div></button>`;
function renderSettings() {
  $('settings-title').textContent = t('settings');
  const html = `<div class="set-group-title">${esc(t('appearance'))}</div>${rowLink('theme', 'theme', esc(t('theme')), '', nameOf(themeOpts(), settings.theme))}${rowLink('lang', 'language-outline', esc(t('language')), '', nameOf(LANGS, settings.lang))}
    <div class="set-group-title">${esc(t('notesGroup'))}</div>${rowLink('view', 'grid-outline', esc(t('defaultView')), '', nameOf(viewOpts(), settings.view))}${rowLink('sort', 'swap-vertical-outline', esc(t('defaultSort')), '', nameOf(sortOpts(), settings.sort))}
    ${rowSwitch('newChecklist', 'checkbox-outline', esc(t('newChecklistDef')), '', settings.newChecklist)}${rowSwitch('confirmDelete', 'shield-checkmark-outline', esc(t('confirmDelete')), esc(t('confirmDeleteSub')), settings.confirmDelete)}${rowLink('trashDays', 'trash-outline', esc(t('trashKeep')), '', settings.trashDays + ' ' + t('days'))}${rowLink('pinLength', 'keypad-outline', esc(t('pinLength')), '', settings.pinLength + ' dígitos')}
    <div class="set-group-title">${esc(t('dataGroup'))}</div>${rowLink('export', 'share-outline', esc(t('export')), esc(t('exportSub')), '')}${rowLink('import', 'download-outline', esc(t('importT')), esc(t('importSub')), '')}${rowLink('clearAll', 'nuclear-outline', esc(t('clearAll')), '', '')}
    <div class="set-group-title">${esc(t('about'))}</div>${rowLink('about', 'information-circle-outline', 'Brivane Notes', esc(t('version')) + ' 1.7.0', '')}${rowLink('resetAll', 'warning-outline', esc(t('resetAll')), '', '')}`;
  const body = $('settings-body'), sc = body.scrollTop; body.innerHTML = html; body.scrollTop = sc;
  applyMaskIcons(body);
  body.querySelectorAll('[data-sw]').forEach(row => row.addEventListener('click', () => { const k = row.dataset.sw; setSetting(k, !settings[k]); row.querySelector('.switch').classList.toggle('on', settings[k]); }));
  body.querySelectorAll('[data-set]').forEach(row => row.addEventListener('click', () => onSettingRow(row.dataset.set)));
}
async function changeLanguage(code) { toast(t('langLoading')); const ok = await loadLanguage(code); if (!ok && code !== 'pt') { toast(t('langFail')); return; } setSetting('lang', code); applyLanguage(); }
function exportNotes() { saveTextFile('brivane-notes.json', JSON.stringify({ app: 'brivane-notes', v: 7, notes: NOTES, folders: FOLDERS, tags: TAGS }, null, 2), 'application/json'); }
function importNotes() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d || !Array.isArray(d.notes)) throw 0; const ids = new Set(NOTES.map(n => n.id)); d.notes.forEach(n => { if (n && n.id && !ids.has(n.id)) NOTES.push(n); }); (d.folders || []).forEach(x => { if (!FOLDERS.some(y => y.id === x.id)) FOLDERS.push(x); }); (d.tags || []).forEach(x => { if (!TAGS.includes(x)) TAGS.push(x); }); persist(); refreshAll(); toast(t('imported')); } catch (_) { toast(t('importFail')); } }; fr.readAsText(f); });
  inp.click();
}
function onSettingRow(id) {
  switch (id) {
    case 'theme': openChoice(t('theme'), themeOpts(), settings.theme, v => { setSetting('theme', v); applyTheme(); renderSettings(); }); break;
    case 'lang': openChoice(t('language'), LANGS, settings.lang, v => changeLanguage(v)); break;
    case 'view': openChoice(t('defaultView'), viewOpts(), settings.view, v => { setSetting('view', v); renderSettings(); renderHome(); }); break;
    case 'sort': openChoice(t('defaultSort'), sortOpts(), settings.sort, v => { setSetting('sort', v); renderSettings(); }); break;
    case 'trashDays': openChoice(t('trashKeep'), trashOpts(), settings.trashDays, v => { setSetting('trashDays', v); renderSettings(); }); break;
    case 'pinLength': openChoice(t('pinLength'), pinLenOpts(), settings.pinLength, v => { setSetting('pinLength', v); renderSettings(); }); break;
    case 'export': exportNotes(); break; case 'import': importNotes(); break;
    case 'clearAll': openDialog(t('clearAll'), '', t('delete'), () => { NOTES = []; FOLDERS = []; TAGS = []; persist(); refreshAll(); toast(t('cleared')); }, { noInput: true, message: t('clearAllQ'), danger: true }); break;
    case 'about': openDialog('Brivane Notes', '', t('ok'), null, { noInput: true, message: t('version') + ' 1.7.0' }); break;
    case 'resetAll': openDialog(t('resetAll'), '', t('reset'), async () => { settings = Object.assign({}, DEFAULTS); save('settings', settings); await loadLanguage('pt'); applyTheme(); applyLanguage(); renderSettings(); toast(t('settingsReset')); }, { noInput: true, message: t('resetAll') + '?' }); break;
  }
}
pageHooks['page-settings'] = { open: renderSettings };

function applyLanguage() {
  document.documentElement.lang = settings.lang; document.documentElement.dir = RTL_LANGS.includes(settings.lang) ? 'rtl' : 'ltr';
  document.querySelectorAll('.bb-item[data-tab] span:not(.icon)').forEach(sp => { const k = sp.parentElement.dataset.tab; sp.textContent = t(k === 'home' ? 'notes' : k); });
  $('search-fake-txt').textContent = t('searchNotes'); $('sp-input').placeholder = t('searchNotes'); $('cat-title').textContent = t('browseBy');
  $('mi-sort').querySelector('.grow').textContent = t('sort'); $('mi-select').querySelector('.grow').textContent = t('select');
  $('mi-archive').querySelector('.grow').textContent = t('archiveT'); $('mi-trash').querySelector('.grow').textContent = t('trashT');
  $('mi-translate').querySelector('.grow').textContent = t('translateApp'); $('mi-translate').querySelector('.mi-tag').textContent = t('comingSoon');
  $('mi-settings').querySelector('.grow').textContent = t('settings');
  $('dialog-cancel').textContent = t('cancel'); $('dialog-input').placeholder = t('folderName');
  $('archive-title').textContent = t('archiveT'); $('trash-title').textContent = t('trashT'); $('settings-title').textContent = t('settings');
  setPageTitle(activeTab); syncEditorMode(); syncBar(); syncViewMenu();
  renderHome(); renderSearchTab(); renderReminders(); renderFolders();
  if (pageStack.includes('page-settings')) renderSettings();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (activeTab === 'reminders') renderReminders(); if (activeTab === 'home') renderHome(); } });
$('bottom-bar').addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

(async function init() {
  applyMaskIcons(document);
  if (settings.lang && settings.lang !== 'pt') await loadLanguage(settings.lang);
  applyTheme(); purgeTrash(); applyLanguage(); syncBar(); renderPinPad(); updateFabState();
})();
</script>
</body>
</html>
