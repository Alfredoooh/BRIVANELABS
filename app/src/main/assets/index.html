<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Brivane Notes</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#FFFFFF;--bg-rgb:255,255,255;--surface:#F5F5F5;--surface2:#ECECEE;--floating:#FFFFFF;--popup:#FFFFFF;
  --text:#1C1C1E;--text2:#6E6E73;--accent:#2596be;--accent-rgb:37,150,190;--on-accent:#FFFFFF;--accent-container:rgba(37,150,190,.16);
  --border:#ECECEE;--outline:#DCDCE0;--danger:#FF3B30;
  --tb-shadow:0 6px 24px rgba(0,0,0,.14);--popup-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  --snack-bg:#323232;--snack-fg:#F2F2F2;--snack-act:#7CCBEA;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --top-extra:46px;--bar-h:58px;--kb:0px;--android-kb:0px;
  --emphasized:cubic-bezier(.2,0,0,1);--emphasized-decel:cubic-bezier(.05,.7,.1,1);--emphasized-accel:cubic-bezier(.3,0,.8,.15);--ios:cubic-bezier(.32,.72,0,1);
  --sheet-r:34px;
  --n-none:var(--surface);--n-red:#FDE3E1;--n-orange:#FDEBD7;--n-yellow:#FBF4CB;--n-green:#E1F3DC;--n-teal:#D7F0EE;--n-blue:#DCEBFA;--n-purple:#E9E0F8;--n-pink:#FADDEB;--n-ink:#1C1C1E;
}
[data-theme="dark"]{
  --bg:#0D0D0D;--bg-rgb:13,13,13;--surface:#1F1F1F;--surface2:#2A2A2C;--floating:#1F1F1F;--popup:#1F1F1F;
  --text:#F2F2F2;--text2:#9B9B9F;--on-accent:#FFFFFF;--border:#3A3A3C;--outline:#48484A;--danger:#FF453A;
  --tb-shadow:0 6px 24px rgba(0,0,0,.55);--popup-shadow:0 8px 28px rgba(0,0,0,.5);
  --snack-bg:#E3E3E6;--snack-fg:#1C1C1E;--snack-act:#0E6C8C;
  --n-red:#4A2624;--n-orange:#4A3320;--n-yellow:#46411D;--n-green:#24391F;--n-teal:#1E3B39;--n-blue:#1F3448;--n-purple:#35294F;--n-pink:#4C263A;--n-ink:#F2F2F2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
input:focus,textarea:focus,button:focus,[contenteditable]:focus{outline:none}
.icon{pointer-events:none;display:inline-block;width:1em;height:1em;vertical-align:middle;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;font-family:inherit}
.tap{transition:transform .2s var(--emphasized),opacity .2s ease}
.tap:active{transform:scale(.95);opacity:.85}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#root{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .42s var(--ios);will-change:transform}
#root.pushed{transform:translate3d(-28%,0,0)}
#root-dim{position:absolute;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity .42s var(--ios)}
#topbar{padding-top:calc(var(--safe-top) + var(--top-extra))}
.bb-item.active{color:var(--accent)}
.fchip.active{background:var(--accent);color:var(--on-accent)}
.note-card{background:var(--n-none);color:var(--n-ink);animation:fadeUp .4s var(--emphasized-decel) both;border:1.5px solid transparent;transition:transform .2s var(--emphasized),border-color .2s ease}
.note-card:active{transform:scale(.97)}
.note-card.sel{border-color:var(--accent)}
.note-card[data-c="red"]{background:var(--n-red)}.note-card[data-c="orange"]{background:var(--n-orange)}.note-card[data-c="yellow"]{background:var(--n-yellow)}.note-card[data-c="green"]{background:var(--n-green)}
.note-card[data-c="teal"]{background:var(--n-teal)}.note-card[data-c="blue"]{background:var(--n-blue)}.note-card[data-c="purple"]{background:var(--n-purple)}.note-card[data-c="pink"]{background:var(--n-pink)}
.nc-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nc-body{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s}
.view::-webkit-scrollbar{display:none}
.view.active{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .28s ease,visibility 0s}
#bottom-bar::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:20px;pointer-events:none;background:linear-gradient(to bottom,rgba(var(--bg-rgb),0),rgba(var(--bg-rgb),.9))}
#fab{bottom:calc(var(--bar-h) + var(--safe-bottom) + 18px);box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .45s var(--emphasized),opacity .3s ease}
#fab:active{transform:scale(.92)}
body.snack-on:not(.on-page):not(.sel-mode) #fab{transform:translateY(-58px)}
body.on-page #fab,body.sel-mode #fab{transform:translateY(160px) scale(.6);opacity:0;pointer-events:none}
.page{position:absolute;inset:0;z-index:60;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ios),visibility 0s linear .42s;box-shadow:-10px 0 28px rgba(0,0,0,.14);will-change:transform;contain:layout paint}
.page.open{transform:translate3d(0,0,0);visibility:visible;transition:transform .42s var(--ios),visibility 0s}
.page.behind{transform:translate3d(-28%,0,0);visibility:visible}
.page.leaving{transform:translate3d(100%,0,0);visibility:visible;transition:transform .36s var(--ios),visibility 0s linear .36s}
.page.dragging,#root.dragging{transition:none!important}
.page-bar{padding-top:calc(var(--safe-top) + var(--top-extra) - 6px)}
.page-body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain}
.page-body::-webkit-scrollbar{display:none}
#swipe-edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:65;display:none;touch-action:none}
#swipe-edge.on{display:block}
#page-editor{transition:transform .42s var(--ios),visibility 0s linear .42s,background .3s ease}
#page-editor.open{transition:transform .42s var(--ios),visibility 0s,background .3s ease}
#ed-scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:calc(var(--kb) + 120px);overscroll-behavior-y:contain;scroll-padding-bottom:100px}
#ed-scroll::-webkit-scrollbar{display:none}
#ed-title{resize:none;overflow:hidden}
#ed-body{word-break:break-word}
#ed-body:empty::before{content:attr(data-ph);color:var(--text2);opacity:.55;pointer-events:none}
#ed-body img{max-width:100%;height:auto;border-radius:18px;display:block;margin:10px 0}
#ed-body hr{border:0;height:2px;background:var(--outline);margin:16px 0;border-radius:2px}
#ed-body blockquote{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:10px 0;opacity:.9}
#ed-body ul,#ed-body ol{padding-left:26px;margin:6px 0}
#ed-body a{color:var(--accent)}
#ed-body code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border-radius:8px;padding:1px 6px;font-size:.92em}
#ed-body table{border-collapse:collapse;width:100%;margin:10px 0}
#ed-body td,#ed-body th{border:1px solid var(--outline);padding:8px 10px;min-width:60px;position:relative}
#ed-body .bri-video{position:relative;border-radius:18px;overflow:hidden;background:#000;margin:10px 0}
#ed-body .bri-video img{margin:0;border-radius:0;display:block;width:100%}
#ed-body .bri-video .vp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
#ed-body .bri-video .vp .icon{width:52px;height:52px;color:#fff}
.img-resizable{position:relative;display:inline-block;max-width:100%}
.img-resizable .rh{position:absolute;width:18px;height:18px;background:var(--accent);border:2px solid #fff;border-radius:50%;right:-9px;bottom:-9px;touch-action:none;z-index:2}
.float-box{position:relative;border:1.5px dashed var(--outline);border-radius:16px;padding:8px;margin:10px 0}
.float-box .fb-handle{position:absolute;top:-14px;right:-14px;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--outline);display:flex;align-items:center;justify-content:center}
#ed-toolbar{position:absolute;left:12px;right:12px;z-index:6;bottom:calc(var(--kb) + var(--android-kb) + var(--safe-bottom) + 16px);border-radius:26px;background:var(--floating);box-shadow:var(--tb-shadow);display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;transition:bottom .18s var(--emphasized)}
#ed-toolbar::-webkit-scrollbar{display:none}
.tb-pill{display:flex;align-items:center;background:var(--surface);border-radius:999px;padding:3px;flex-shrink:0;margin-right:4px}
.tb-btn{width:40px;height:40px;flex-shrink:0;border:0;background:transparent;color:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .12s ease,color .12s ease}
.tb-btn:active{background:var(--surface)}
.tb-btn.on{background:var(--accent-container);color:var(--accent)}
.tb-btn.disabled{opacity:.35}
.tb-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--outline)}
#draw-modal{position:absolute;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column}
#draw-modal.open{display:flex;animation:fadeUp .25s var(--emphasized-decel) both}
#draw-top{padding-top:calc(var(--safe-top) + var(--top-extra) - 6px)}
#draw-wrap{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#fff;border:1px solid var(--border)}
#draw-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sw{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:2px solid var(--outline)}
.switch{position:relative;width:46px;height:28px;border-radius:999px;flex-shrink:0;background:var(--surface2);border:2px solid var(--outline);transition:background .2s ease,border-color .2s ease}
.switch::after{content:'';position:absolute;top:50%;left:4px;width:14px;height:14px;border-radius:50%;background:var(--text2);transform:translateY(-50%);transition:left .25s var(--emphasized),width .25s var(--emphasized),height .25s var(--emphasized),background .2s ease}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:20px;width:20px;height:20px;background:var(--on-accent)}
#menu-overlay{position:absolute;inset:0;z-index:90;visibility:hidden;background:rgba(0,0,0,0);transition:background .2s linear,visibility 0s linear .2s}
#menu-overlay.open{visibility:visible;background:rgba(0,0,0,.32);transition:background .2s linear,visibility 0s}
#menu-pop{position:absolute;top:calc(var(--safe-top) + var(--top-extra) - 4px);right:14px;width:290px;transform-origin:top right;background:var(--popup);box-shadow:var(--popup-shadow);transform:scale(.85);opacity:0;transition:transform .15s var(--emphasized-accel),opacity .1s linear}
#menu-overlay.open #menu-pop{transform:scale(1);opacity:1;transition:transform .3s var(--emphasized-decel),opacity .15s linear}
.menu-item:active{background:var(--surface)}
.menu-item.danger{color:var(--danger)}
.sheet-layer{position:absolute;inset:0;z-index:100;visibility:hidden;background:rgba(0,0,0,0);transition:background .3s linear,visibility 0s linear .42s}
.sheet-layer.open{visibility:visible;background:rgba(0,0,0,.45);transition:background .3s linear,visibility 0s}
.sheet-layer.closing{visibility:visible;background:rgba(0,0,0,0);transition:background .3s linear,visibility 0s linear .42s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;background:var(--popup);border-radius:var(--sheet-r) var(--sheet-r) 0 0;transform:translate3d(0,100%,0);transition:transform .42s var(--ios);will-change:transform}
.sheet-layer.open .sheet-panel{transform:translate3d(0,0,0)}
.sheet-layer.closing .sheet-panel{transform:translate3d(0,100%,0);transition:transform .34s var(--ios)}
.sheet-panel.dragging{transition:none!important}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--outline);margin:0 auto}
.sheet-content{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.sheet-content::-webkit-scrollbar{display:none}
.opt-row:active{background:var(--surface)}
.opt-row.sel .radio{border-color:var(--accent)}
.opt-row.sel .radio::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.opt-row.check.sel .radio{background:var(--accent);border-color:var(--accent)}
.opt-row.check.sel .radio::before{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.c-dot{border:2px solid var(--outline);color:var(--text);transition:transform .2s var(--emphasized),border-color .2s ease}
.c-dot:active{transform:scale(.9)}
.c-dot.sel{border-color:var(--accent);border-width:3px}
.dt-field input{-webkit-appearance:none;appearance:none;color-scheme:light}
[data-theme="dark"] .dt-field input{color-scheme:dark}
#share-card{color:var(--n-ink)}
#dialog-overlay{position:absolute;inset:0;z-index:130;visibility:hidden;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;padding-bottom:calc(24px + var(--kb));transition:background .2s linear,padding-bottom .25s var(--emphasized),visibility 0s linear .2s}
#dialog-overlay.open{visibility:visible;background:rgba(0,0,0,.5);transition:background .2s linear,padding-bottom .25s var(--emphasized),visibility 0s}
#dialog{transform:scale(.88);opacity:0;transition:transform .15s var(--emphasized-accel),opacity .1s linear}
#dialog-overlay.open #dialog{transform:scale(1);opacity:1;transition:transform .3s var(--emphasized-decel),opacity .15s linear}
#dialog-input{border:2px solid var(--outline)}
.dlg-btn{color:var(--accent)}
.dlg-btn:active{background:var(--accent-container)}
.dlg-btn.danger{color:var(--danger)}
#toast{left:8px;right:8px;max-width:560px;margin:0 auto;z-index:140;bottom:calc(var(--bar-h) + var(--safe-bottom) + 8px);background:var(--snack-bg);color:var(--snack-fg);box-shadow:0 2px 6px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.18);transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .25s var(--emphasized-decel),opacity .2s linear}
body.on-page #toast{bottom:calc(var(--safe-bottom) + 12px)}
body.editor-open #toast{bottom:calc(var(--kb) + var(--android-kb) + var(--safe-bottom) + 16px + 52px + 10px)}
#toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
#toast-msg{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#pin-overlay{position:absolute;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#pin-overlay.open{display:flex}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--outline)}
.pin-dot.fill{background:var(--accent);border-color:var(--accent)}
.pin-key{width:76px;height:76px;border-radius:50%;background:var(--surface);color:var(--text);border:0;font-size:26px;font-weight:600}
.pin-key:active{background:var(--surface2)}
.tmpl-card{border:1.5px solid var(--outline);border-radius:18px;overflow:hidden}
.tmpl-card.sel{border-color:var(--accent);border-width:2.5px}
</style>
</head>
<body>
<div id="app">

  <div id="root">
    <div id="topbar" class="relative z-20 flex-shrink-0 px-5 pb-3 flex items-center gap-2.5 bg-bg">
      <div id="page-title" class="flex-1 min-w-0 text-[30px] font-extrabold tracking-tight leading-tight whitespace-nowrap overflow-hidden text-ellipsis">Notas</div>
      <button id="menu-btn" class="top-btn tap w-10 h-10 rounded-full flex-shrink-0 bg-surface text-text border-0 flex items-center justify-center" aria-label="Opções"><span class="icon w-5 h-5" style="-webkit-mask-image:url('icons/ellipsis-horizontal.svg');mask-image:url('icons/ellipsis-horizontal.svg')"></span></button>
    </div>

    <div id="sel-bar" class="absolute left-0 right-0 top-0 z-25 hidden items-center gap-0.5 px-2.5 pb-2.5 bg-bg" style="padding-top:calc(var(--safe-top) + var(--top-extra) - 6px)">
      <button class="icon-plain tap w-11 h-11 rounded-full flex items-center justify-center text-text" id="sel-close" aria-label="Cancelar"><span class="icon w-6 h-6" style="-webkit-mask-image:url('icons/close.svg')"></span></button>
      <div id="sel-info" class="flex-1 min-w-0 flex items-baseline gap-1.5 pl-1"><span id="sel-num" class="text-[22px] font-extrabold tracking-tight leading-none">0</span><span id="sel-lbl" class="text-[13px] font-semibold text-text2 whitespace-nowrap overflow-hidden text-ellipsis">selecionadas</span></div>
      <button class="icon-plain tap w-10 h-10 rounded-full flex items-center justify-center text-text" id="sel-all" aria-label="Selecionar tudo"><span class="icon w-5.5 h-5.5" style="-webkit-mask-image:url('icons/checkmark-done-outline.svg')"></span></button>
      <button class="icon-plain tap w-10 h-10 rounded-full flex items-center justify-center text-text" id="sel-pin" aria-label="Fixar"><span class="icon w-5.5 h-5.5" style="-webkit-mask-image:url('icons/pin-outline.svg')"></span></button>
      <button class="icon-plain tap w-10 h-10 rounded-full flex items-center justify-center text-text" id="sel-color" aria-label="Cor"><span class="icon w-5.5 h-5.5" style="-webkit-mask-image:url('icons/color-palette-outline.svg')"></span></button>
      <button class="icon-plain tap w-10 h-10 rounded-full flex items-center justify-center text-text" id="sel-archive" aria-label="Arquivar"><span class="icon w-5.5 h-5.5" style="-webkit-mask-image:url('icons/archive-outline.svg')"></span></button>
      <button class="icon-plain danger tap w-10 h-10 rounded-full flex items-center justify-center text-danger" id="sel-del" aria-label="Apagar"><span class="icon w-5.5 h-5.5" style="-webkit-mask-image:url('icons/trash-outline.svg')"></span></button>
    </div>

    <div id="tabs" class="relative flex-1 min-h-0">
      <div id="view-home" class="view active pb-32"><div id="home-filters" class="flex gap-2 px-5 pb-4 overflow-x-auto"></div><div id="home-pinned"></div><div id="home-notes"></div></div>
      <div id="view-search" class="view pb-32">
        <div id="search-row" class="flex items-center px-5 mb-1.5"><button id="search-fake" class="tap flex-1 min-w-0 flex items-center gap-2.5 h-13 px-4.5 rounded-full bg-surface text-text2 text-base font-medium border-0 text-left"><span class="icon w-5 h-5 flex-shrink-0" style="-webkit-mask-image:url('icons/search.svg')"></span><span id="search-fake-txt">Pesquisar nas notas</span></button></div>
        <div id="tags-strip" class="pt-3.5"></div><div id="cat-title" class="text-[22px] font-extrabold tracking-tight px-5 pt-4.5 pb-3.5">Procurar por</div><div id="cat-grid" class="grid grid-cols-2 gap-3 px-5"></div>
      </div>
      <div id="view-reminders" class="view pb-32"><div id="rem-list"></div></div>
      <div id="view-folders" class="view pb-32"><div id="folder-list"></div></div>
    </div>

    <div id="bottom-bar" class="relative flex-shrink-0 z-30 flex items-stretch bg-bg" style="height:calc(var(--bar-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom)">
      <button class="bb-item flex-1 min-w-0 border-0 bg-transparent flex flex-col items-center justify-center gap-0.5 text-text2 active" data-tab="home"><span class="icon w-6 h-6" style="-webkit-mask-image:url('icons/document-text.svg')"></span><span class="text-[11px] font-semibold">Notas</span></button>
      <button class="bb-item flex-1 min-w-0 border-0 bg-transparent flex flex-col items-center justify-center gap-0.5 text-text2" data-tab="search"><span class="icon w-6 h-6" style="-webkit-mask-image:url('icons/search-outline.svg')"></span><span class="text-[11px] font-semibold">Pesquisar</span></button>
      <button class="bb-item flex-1 min-w-0 border-0 bg-transparent flex flex-col items-center justify-center gap-0.5 text-text2" data-tab="reminders"><span class="icon w-6 h-6" style="-webkit-mask-image:url('icons/notifications-outline.svg')"></span><span class="text-[11px] font-semibold">Lembretes</span></button>
      <button class="bb-item flex-1 min-w-0 border-0 bg-transparent flex flex-col items-center justify-center gap-0.5 text-text2" data-tab="folders"><span class="icon w-6 h-6" style="-webkit-mask-image:url('icons/folder-outline.svg')"></span><span class="text-[11px] font-semibold">Pastas</span></button>
    </div>
  </div>
  <div id="root-dim"></div>

  <button id="fab" class="tap absolute right-5 z-52 w-14 h-14 rounded-full border-0 bg-accent text-onaccent flex items-center justify-center" aria-label="Nova nota"><span class="icon w-7 h-7" style="-webkit-mask-image:url('icons/add.svg')"></span></button>

  const mk = c => `<div class="ck-row flex items-start gap-2.5 py-1${c.done ? '' : ''}" data-id="${c.id}"><button class="ck-box tap w-6.5 h-6.5 mt-0.5 rounded-full border-2 flex-shrink-0 flex items-center justify-center" style="border-color:${c.done ? 'var(--accent)' : 'var(--outline)'};background:${c.done ? 'var(--accent)' : 'transparent'};color:${c.done ? 'var(--on-accent)' : 'transparent'}" aria-label="ok">${icon('checkmark', 'w-4 h-4')}</button><textarea class="ck-input flex-1 min-w-0 border-0 bg-transparent text-text text-[17px] leading-snug font-medium py-0.5 resize-none${c.done ? ' line-through opacity-45' : ''}" rows="1" placeholder="${esc(t('addItem'))}">${esc(c.text)}</textarea><button class="ck-del tap w-8.5 h-8.5 rounded-full border-0 bg-transparent text-text2 flex items-center justify-center flex-shrink-0 opacity-60" aria-label="x">${icon('close', 'w-5 h-5')}</button></div>`;
  $('ed-checks').innerHTML = n.checks.filter(c => !c.done).map(mk).join(''); $('ed-checks-done').innerHTML = n.checks.filter(c => c.done).map(mk).join('');
  $('ck-done-title').classList.toggle('hidden', !n.checks.some(c => c.done));
  edScroll.querySelectorAll('.ck-row').forEach(row => {
    const c = n.checks.find(x => x.id === row.dataset.id), inp = row.querySelector('.ck-input'); autoGrow(inp);
    inp.addEventListener('input', () => { c.text = inp.value.replace(/\n/g, ''); autoGrow(inp); scheduleSave(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCheck(c.id); } else if (e.key === 'Backspace' && !inp.value && n.checks.length > 1) { e.preventDefault(); removeCheck(c.id, true); } });
    row.querySelector('.ck-box').addEventListener('click', () => { c.done = !c.done; renderChecks(); scheduleSave(); });
    row.querySelector('.ck-del').addEventListener('click', () => removeCheck(c.id, false));
  });
}
function addCheck(afterId) {
  const n = editing; if (!n) return; const item = { id: uid('c'), text: '', done: false };
  const i = afterId ? n.checks.findIndex(c => c.id === afterId) : n.checks.length - 1;
  n.checks.splice(i + 1, 0, item); renderChecks(); scheduleSave();
  setTimeout(() => { const el = edScroll.querySelector(`.ck-row[data-id="${item.id}"] .ck-input`); if (el) el.focus(); }, 30);
}
function removeCheck(id, focusPrev) {
  const n = editing; if (!n) return; const i = n.checks.findIndex(c => c.id === id); if (i < 0) return;
  n.checks.splice(i, 1); if (!n.checks.length) n.checks.push({ id: uid('c'), text: '', done: false }); renderChecks(); scheduleSave();
  if (focusPrev) setTimeout(() => { const els = edScroll.querySelectorAll('.ck-row .ck-input'), el = els[Math.max(0, i - 1)]; if (el) el.focus(); }, 30);
}
$('ck-add').addEventListener('click', () => addCheck(null));

function convertToChecklist() {
  const n = editing; if (!n) return;
  if (!n.isCheck) {
    n.body = cleanBodyHTML(); const lines = htmlToText(n.body).split('\n').map(s => s.trim()).filter(Boolean);
    n.checks = lines.length ? lines.map(s => ({ id: uid('c'), text: s.replace(/^[-*•☐☑]\s*/, ''), done: /^☑/.test(s) })) : [{ id: uid('c'), text: '', done: false }]; n.isCheck = true;
  } else { const txt = n.checks.filter(c => c.text.trim()).map(c => esc(c.text)).join('<br>'); n.body = txt; n.isCheck = false; edBody.innerHTML = txt; }
  syncEditorMode(); renderChecks(); scheduleSave();
}

  $('folder-title').textContent = f.name;
  const list = sortNotes(activeNotes().filter(n => n.folder === f.id)), body = $('folder-body');
  if (!list.length) { body.innerHTML = `<div class="flex flex-col items-center justify-center px-8 py-16 text-center text-text2">${icon('folder-open-outline', 'w-13 h-13 opacity-35 mb-3.5')}<div class="text-base font-bold text-text mb-1.5">${esc(t('emptyFolder'))}</div><div class="text-sm leading-snug max-w-[260px]">${esc(t('emptyFolderSub'))}</div><button class="btn-fill tap h-11 px-5.5 rounded-full border-0 bg-accent text-onaccent flex items-center gap-2 text-sm font-bold mt-4.5" id="folder-new-note">${icon('add')}${esc(t('newNote'))}</button></div>`; $('folder-new-note').addEventListener('click', () => openEditor(null, { folder: f.id })); return; }
  renderNotesInto(body, list, { noSelect: true });
}
pageHooks['page-folder'] = { open: renderFolderPage, close() { renderFolders(); } };
$('folder-more').addEventListener('click', () => {
  const f = FOLDERS.find(x => x.id === openFolderId); if (!f) return;
  const entry = openSheet(`<div class="flex items-center gap-3.5 px-5 pb-3 border-b mb-1.5" style="border-color:var(--border)"><div class="w-13 h-13 rounded-full flex items-center justify-center flex-shrink-0" style="background:var(--accent-container);color:var(--accent)">${icon('folder', 'w-6.5 h-6.5')}</div><div class="min-w-0 flex-1"><div class="text-base font-bold whitespace-nowrap overflow-hidden text-ellipsis">${esc(f.name)}</div></div></div>${sheetItem('new', 'add', t('newNote'))}${sheetItem('rename', 'create-outline', t('renameFolder'))}${sheetItem('delete', 'trash-outline', t('deleteFolder'), true)}`);
  entry.content.querySelector('[data-act="new"]').addEventListener('click', () => { closeSheet(entry); openEditor(null, { folder: f.id }); });
  entry.content.querySelector('[data-act="rename"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('renameFolder'), f.name, t('save'), name => { f.name = name; persist(); renderFolderPage(); }), 200)));
  entry.content.querySelector('[data-act="delete"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('deleteFolder'), '', t('delete'), () => { NOTES.forEach(n => { if (n.folder === f.id) n.folder = ''; }); FOLDERS = FOLDERS.filter(x => x.id !== f.id); persist(); popPage(); renderFolders(); toast(t('folderDeleted')); }, { noInput: true, message: f.name + '?', danger: true }), 200)));
});

/* ── Arquivo / Lixeira ── */
function renderArchive() {
  const list = sortNotes(NOTES.filter(n => n.archived && !n.trashed)), body = $('archive-body');
  if (!list.length) { body.innerHTML = `<div class="flex flex-col items-center justify-center px-8 py-16 text-center text-text2">${icon('archive-outline', 'w-13 h-13 opacity-35 mb-3.5')}<div class="text-base font-bold text-text mb-1.5">${esc(t('emptyArchive'))}</div><div class="text-sm leading-snug max-w-[260px]">${esc(t('emptyArchiveSub'))}</div></div>`; return; }
  renderNotesInto(body, list, { noSelect: true, showFolder: true });
}
pageHooks['page-archive'] = { open() { $('archive-title').textContent = t('archiveT'); renderArchive(); }, close() { refreshAll(); } };
function renderTrash() {
  purgeTrash(); const list = NOTES.filter(n => n.trashed).sort((a, b) => b.trashedAt - a.trashedAt), body = $('trash-body');
  $('trash-empty').style.visibility = list.length ? 'visible' : 'hidden';
  if (!list.length) { body.innerHTML = `<div class="flex flex-col items-center justify-center px-8 py-16 text-center text-text2">${icon('trash-outline', 'w-13 h-13 opacity-35 mb-3.5')}<div class="text-base font-bold text-text mb-1.5">${esc(t('emptyTrash'))}</div><div class="text-sm leading-snug max-w-[260px]">${esc(t('emptyTrashSub'))}</div></div>`; return; }
  body.innerHTML = `<div class="flex flex-col">${list.map((n, i) => { const left = Math.max(0, Math.ceil((n.trashedAt + settings.trashDays * 86400000 - Date.now()) / 86400000));
    return `<button class="row flex items-center gap-3.5 py-2.5 pl-5 pr-2 w-full border-0 bg-transparent text-text text-left" data-id="${n.id}" style="animation-delay:${Math.min(i, 8) * 30}ms"><div class="w-13.5 h-13.5 rounded-full flex items-center justify-center flex-shrink-0" style="background:var(--surface2);color:var(--text2)">${icon('document-text', 'w-6.5 h-6.5')}</div><div class="flex-1 min-w-0"><div class="text-base font-semibold">${esc(noteLabel(n))}</div><div class="text-sm text-text2 mt-0.5">${left} ${esc(t('days'))}</div></div></button>`; }).join('')}</div>`;
  body.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
    const n = getNote(r.dataset.id); if (!n) return;
    const entry = openSheet(`<div class="flex items-center gap-3.5 px-5 pb-3 border-b mb-1.5" style="border-color:var(--border)"><div class="w-13 h-13 rounded-full flex items-center justify-center flex-shrink-0" style="background:var(--accent-container);color:var(--accent)">${icon('document-text', 'w-6.5 h-6.5')}</div><div class="min-w-0 flex-1"><div class="text-base font-bold whitespace-nowrap overflow-hidden text-ellipsis">${esc(noteLabel(n))}</div></div></div>${sheetItem('restore', 'arrow-undo-outline', t('restore'))}${sheetItem('del', 'trash-bin-outline', t('deleteForever'), true)}`);
    entry.content.querySelector('[data-act="restore"]').addEventListener('click', () => { closeSheet(entry); n.trashed = false; n.trashedAt = 0; persist(); renderTrash(); toast(t('restored')); });
    entry.content.querySelector('[data-act="del"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('deleteForever'), '', t('delete'), () => { NOTES = NOTES.filter(x => x.id !== n.id); persist(); renderTrash(); }, { noInput: true, message: t('deleteForeverQ'), danger: true }), 200)));
  }));
}
pageHooks['page-trash'] = { open() { $('trash-title').textContent = t('trashT'); renderTrash(); }, close() { refreshAll(); } };
$('trash-empty').addEventListener('click', () => openDialog(t('emptyTrashBtn'), '', t('delete'), () => { NOTES = NOTES.filter(n => !n.trashed); persist(); renderTrash(); toast(t('trashEmptied')); }, { noInput: true, message: t('emptyTrashQ'), danger: true }));

/* ── Definições ── */
const themeOpts = () => [{id:'system',name:t('themeAuto')},{id:'light',name:t('themeLight')},{id:'dark',name:t('themeDark')}];
const viewOpts = () => [{id:'grid',name:t('gridView')},{id:'list',name:t('listView')}];
const sortOpts = () => [{id:'edited',name:t('sortEdited')},{id:'created',name:t('sortCreated')},{id:'title',name:t('sortTitle')},{id:'color',name:t('sortColor')}];
const trashOpts = () => [7, 14, 30, 60].map(d => ({ id: d, name: d + ' ' + t('days') }));
const nameOf = (opts, id) => (opts.find(o => String(o.id) === String(id)) || opts[0]).name;
const rowLink = (id, ic, title, sub, val) => `<button class="set-row tap w-full flex items-center gap-4 px-5 py-3.5 border-0 bg-transparent text-text text-left" data-set="${id}">${icon(ic, 'w-6 h-6 text-text2')}<div class="flex-1 min-w-0"><div class="text-base font-semibold">${title}</div>${sub ? `<div class="text-[13px] text-text2 mt-0.5">${sub}</div>` : ''}</div>${val ? `<div class="text-sm text-text2 font-semibold flex-shrink-0 max-w-[40%] text-right whitespace-nowrap overflow-hidden text-ellipsis">${esc(val)}</div>` : ''}${icon('chevron-forward', 'w-4.5 h-4.5 text-text2 opacity-70')}</button>`;
const rowSwitch = (id, ic, title, sub, on) => `<button class="set-row w-full flex items-center gap-4 px-5 py-3.5 border-0 bg-transparent text-text text-left" data-sw="${id}">${icon(ic, 'w-6 h-6 text-text2')}<div class="flex-1 min-w-0"><div class="text-base font-semibold">${title}</div>${sub ? `<div class="text-[13px] text-text2 mt-0.5">${sub}</div>` : ''}</div><div class="switch${on ? ' on' : ''}"></div></button>`;
function renderSettings() {
  $('settings-title').textContent = t('settings');
  const html = `<div class="text-[13px] font-extrabold tracking-wide uppercase text-accent px-5 pt-5 pb-1.5">${esc(t('appearance'))}</div>${rowLink('theme', 'contrast-outline', esc(t('theme')), '', nameOf(themeOpts(), settings.theme))}${rowLink('lang', 'language-outline', esc(t('language')), '', nameOf(LANGS, settings.lang))}
    <div class="text-[13px] font-extrabold tracking-wide uppercase text-accent px-5 pt-5 pb-1.5">${esc(t('notesGroup'))}</div>${rowLink('view', 'grid-outline', esc(t('defaultView')), '', nameOf(viewOpts(), settings.view))}${rowLink('sort', 'swap-vertical-outline', esc(t('defaultSort')), '', nameOf(sortOpts(), settings.sort))}
    ${rowSwitch('newChecklist', 'checkbox-outline', esc(t('newChecklistDef')), '', settings.newChecklist)}${rowSwitch('confirmDelete', 'shield-checkmark-outline', esc(t('confirmDelete')), esc(t('confirmDeleteSub')), settings.confirmDelete)}${rowLink('trashDays', 'trash-outline', esc(t('trashKeep')), '', settings.trashDays + ' ' + t('days'))}
    <div class="text-[13px] font-extrabold tracking-wide uppercase text-accent px-5 pt-5 pb-1.5">${esc(t('dataGroup'))}</div>${rowLink('export', 'share-outline', esc(t('export')), esc(t('exportSub')), '')}${rowLink('import', 'download-outline', esc(t('importT')), esc(t('importSub')), '')}${rowLink('clearAll', 'nuclear-outline', esc(t('clearAll')), '', '')}
    <div class="text-[13px] font-extrabold tracking-wide uppercase text-accent px-5 pt-5 pb-1.5">${esc(t('about'))}</div>${rowLink('about', 'information-circle-outline', 'Brivane Notes', esc(t('version')) + ' 1.2.0', '')}${rowLink('resetAll', 'warning-outline', esc(t('resetAll')), '', '')}`;
  const body = $('settings-body'), sc = body.scrollTop; body.innerHTML = html; body.scrollTop = sc;
  body.querySelectorAll('[data-sw]').forEach(row => row.addEventListener('click', () => { const k = row.dataset.sw; setSetting(k, !settings[k]); row.querySelector('.switch').classList.toggle('on', settings[k]); }));
  body.querySelectorAll('[data-set]').forEach(row => row.addEventListener('click', () => onSettingRow(row.dataset.set)));
}
async function changeLanguage(code) { toast(t('langLoading')); const ok = await loadLanguage(code); if (!ok && code !== 'pt') { toast(t('langFail')); return; } setSetting('lang', code); applyLanguage(); }
function exportNotes() { saveTextFile('brivane-notes.json', JSON.stringify({ app: 'brivane-notes', v: 3, notes: NOTES, folders: FOLDERS, tags: TAGS }, null, 2), 'application/json'); }
function importNotes() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return; const fr = new FileReader();
    fr.onload = () => { try {
      const d = JSON.parse(fr.result); if (!d || !Array.isArray(d.notes)) throw 0;
      const ids = new Set(NOTES.map(n => n.id)); d.notes.forEach(n => { if (n && n.id && !ids.has(n.id)) NOTES.push(n); });
      (d.folders || []).forEach(x => { if (!FOLDERS.some(y => y.id === x.id)) FOLDERS.push(x); }); (d.tags || []).forEach(x => { if (!TAGS.includes(x)) TAGS.push(x); });
      persist(); refreshAll(); toast(t('imported'));
    } catch (_) { toast(t('importFail')); } };
    fr.readAsText(f);
  });
  inp.click();
}
function onSettingRow(id) {
  switch (id) {
    case 'theme': openChoice(t('theme'), themeOpts(), settings.theme, v => { setSetting('theme', v); applyTheme(); renderSettings(); }); break;
    case 'lang': openChoice(t('language'), LANGS, settings.lang, v => changeLanguage(v)); break;
    case 'view': openChoice(t('defaultView'), viewOpts(), settings.view, v => { setSetting('view', v); renderSettings(); renderHome(); }); break;
    case 'sort': openChoice(t('defaultSort'), sortOpts(), settings.sort, v => { setSetting('sort', v); renderSettings(); }); break;
    case 'trashDays': openChoice(t('trashKeep'), trashOpts(), settings.trashDays, v => { setSetting('trashDays', v); renderSettings(); }); break;
    case 'export': exportNotes(); break; case 'import': importNotes(); break;
    case 'clearAll': openDialog(t('clearAll'), '', t('delete'), () => { NOTES = []; FOLDERS = []; TAGS = []; persist(); refreshAll(); toast(t('cleared')); }, { noInput: true, message: t('clearAllQ'), danger: true }); break;
    case 'about': openDialog('Brivane Notes', '', t('ok'), null, { noInput: true, message: t('version') + ' 1.2.0' }); break;
    case 'resetAll': openDialog(t('resetAll'), '', t('reset'), async () => { settings = Object.assign({}, DEFAULTS); save('settings', settings); await loadLanguage('pt'); applyTheme(); applyLanguage(); renderSettings(); toast(t('settingsReset')); }, { noInput: true, message: t('resetAll') + '?' }); break;
  }
}
pageHooks['page-settings'] = { open: renderSettings };

/* ── Idioma ── */
function applyLanguage() {
  document.documentElement.lang = settings.lang; document.documentElement.dir = RTL_LANGS.includes(settings.lang) ? 'rtl' : 'ltr';
  document.querySelectorAll('.bb-item[data-tab] span').forEach(sp => { const k = sp.parentElement.dataset.tab; sp.textContent = t(k === 'home' ? 'notes' : k); });
  $('search-fake-txt').textContent = t('searchNotes'); $('sp-input').placeholder = t('searchNotes'); $('cat-title').textContent = t('browseBy');
  $('mi-sort').querySelector('.flex-1').textContent = t('sort'); $('mi-select').querySelector('.flex-1').textContent = t('select');
  $('mi-archive').querySelector('.flex-1').textContent = t('archiveT'); $('mi-trash').querySelector('.flex-1').textContent = t('trashT'); $('mi-settings').querySelector('.flex-1').textContent = t('settings');
  $('mi-theme-label').textContent = dark ? t('lightTheme') : t('darkTheme');
  $('dialog-cancel').textContent = t('cancel'); $('dialog-input').placeholder = t('folderName');
  $('archive-title').textContent = t('archiveT'); $('trash-title').textContent = t('trashT'); $('settings-title').textContent = t('settings');
  setPageTitle(activeTab); syncEditorMode(); syncBar(); syncViewMenu();
  renderHome(); renderSearchTab(); renderReminders(); renderFolders();
  if (pageStack.includes('page-settings')) renderSettings();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (activeTab === 'reminders') renderReminders(); if (activeTab === 'home') renderHome(); } });
$('bottom-bar').addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

/* ── Init ── */
(async function init() { if (settings.lang && settings.lang !== 'pt') await loadLanguage(settings.lang); applyTheme(); purgeTrash(); applyLanguage(); syncBar(); renderPinPad(); })();
</script>
</body>
</html>
