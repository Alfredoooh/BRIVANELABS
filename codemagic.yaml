workflows:
  scorezone-android-debug:

    # Nome exibido para este workflow no Codemagic.
    name: scorezone-android-debug

    # Máquina Apple Silicon M2.
    instance_type: mac_mini_m2

    # Tempo máximo de execução de uma build, em minutos.
    max_build_duration: 60

    environment:

      # Variáveis públicas/não sensíveis do projeto.
      vars:
        PACKAGE_NAME: "com.brivanelabs.scorezone"

      # Para utilizar variáveis secretas no futuro, crie um Environment
      # Variable Group no Codemagic e descomente:
      #
      # groups:
      #   - scorezone-production-signing

      # Java 17 é usado pelo Android Gradle Plugin 8.2.x.
      java: 17

    # ---------------------------------------------------------------
    # TRIGGERS
    # ---------------------------------------------------------------
    # O build pode sempre ser iniciado manualmente pela interface
    # do Codemagic.
    #
    # Este bloco adiciona também build automático em PUSH na branch main.
    #
    # Para desativar builds automáticos, remova todo o bloco "triggering".
    # Para reativá-los, mantenha o bloco abaixo e configure o webhook
    # do repositório no painel do Codemagic.
    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true
          source: true

      # Cancela builds antigos da mesma branch quando chega um push novo.
      cancel_previous_builds: true

    # ---------------------------------------------------------------
    # CACHE
    # ---------------------------------------------------------------
    # Mantém caches do Gradle entre builds para acelerar a compilação.
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper/dists

    # ---------------------------------------------------------------
    # SCRIPTS
    # ---------------------------------------------------------------
    scripts:

      # O projeto não depende de Android Studio.
      # O local.properties aponta o Gradle para o SDK disponível no
      # ambiente do Codemagic.
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      # -------------------------------------------------------------
      # KEYSTORE
      # -------------------------------------------------------------
      # Este projeto de teste usa scorezone-debug.keystore versionado
      # na raiz do repositório.
      #
      # Também existe suporte para um cenário futuro em que o keystore
      # seja armazenado como variável secreta Base64:
      #
      # SCOREZONE_KEYSTORE_BASE64
      #
      # A primeira opção é usada automaticamente se o arquivo existir.
      - name: Set up signing keystore
        script: |
          if [ -f "$CM_BUILD_DIR/scorezone-debug.keystore" ]; then
            echo "Using repository keystore: scorezone-debug.keystore"

          elif [ -n "${SCOREZONE_KEYSTORE_BASE64:-}" ]; then
            echo "Decoding SCOREZONE_KEYSTORE_BASE64..."

            if printf '%s' "$SCOREZONE_KEYSTORE_BASE64" | \
              base64 --decode > "$CM_BUILD_DIR/scorezone-debug.keystore" 2>/dev/null
            then
              :
            else
              printf '%s' "$SCOREZONE_KEYSTORE_BASE64" | \
                base64 -D > "$CM_BUILD_DIR/scorezone-debug.keystore"
            fi

            chmod 600 "$CM_BUILD_DIR/scorezone-debug.keystore"

            echo "Keystore decoded successfully."

          else
            echo "ERROR: scorezone-debug.keystore was not found."
            echo "ERROR: SCOREZONE_KEYSTORE_BASE64 is also not configured."
            exit 1
          fi

      # -------------------------------------------------------------
      # BUILD
      # -------------------------------------------------------------
      # Compila exatamente o APK Debug solicitado.
      # --stacktrace deixa os erros do Gradle mais fáceis de diagnosticar.
      - name: Build ScoreZone Debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # -------------------------------------------------------------
      # APK SIZE CHECK
      # -------------------------------------------------------------
      # Limite absoluto:
      # 400 KiB = 409600 bytes.
      #
      # macOS usa:
      # stat -f%z arquivo
      #
      # O build falha explicitamente caso qualquer APK ultrapasse esse
      # limite.
      - name: Verify APK size
        script: |
          set -e

          echo "Generated APK:"
          ls -lh app/build/outputs/apk/debug/*.apk

          found_apk=false

          for apk in app/build/outputs/apk/debug/*.apk; do

            if [ ! -f "$apk" ]; then
              continue
            fi

            found_apk=true

            bytes=$(stat -f%z "$apk")

            kib=$((bytes / 1024))

            echo "----------------------------------------"
            echo "APK: $apk"
            echo "Bytes: $bytes"
            echo "Size: ${kib} KiB"
            echo "Limit: 400 KiB"
            echo "----------------------------------------"

            if [ "$bytes" -gt 409600 ]; then
              echo "ERROR: APK exceeds 400 KiB."
              echo "Build rejected."
              exit 1
            fi

          done

          if [ "$found_apk" = false ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK size check passed."

    # ---------------------------------------------------------------
    # ARTIFACTS
    # ---------------------------------------------------------------
    # O APK aparece na área de Artifacts do Codemagic para download.
    artifacts:
      - app/build/outputs/apk/debug/*.apk

    # ---------------------------------------------------------------
    # PUBLISHING
    # ---------------------------------------------------------------
    # NÃO existe "publishing:" aqui propositalmente.
    #
    # Deixar:
    #
    # publishing:
    #
    # sem conteúdo gera o erro:
    # "none is not an allowed value"
    #
    # Quando quiser ativar notificações por e-mail, substitua esta área
    # por um bloco REAL, por exemplo:
    #
    # publishing:
    #   email:
    #     recipients:
    #       - seu-email@example.com
    #     notify:
    #       success: true
    #       failure: true